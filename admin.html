<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .image-upload-group {
            border: 2px dashed #5A5047;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background-color: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s;
        }
        .image-upload-group:hover {
            background-color: #f0ebe6;
        }
        #prof-foto-file {
            display: none;
        }
        #prof-foto-preview {
            max-width: 150px;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            display: none;
            margin: 10px auto;
        }
        .upload-help {
            font-size: 0.85em;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar" id="admin-sidebar">
            <h2 class="sidebar__title">Admin Panel</h2>
            <nav>
                <ul class="sidebar__nav">
                    <li><a href="#" id="show-areas">Gestión de Áreas</a></li>
                    <li><a href="#" id="show-professionals">Gestión de Profesionales</a></li>
                    <li><button id="logout-button" class="logout-button">Cerrar Sesión</button></li>
                </ul>
            </nav>
        </aside>

        <main class="admin-content">
            <section id="login-screen" class="login-screen">
                <h2>Iniciar Sesión</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit">Ingresar</button>
                    <p id="login-error" class="error-message" style="display: none;">Contraseña incorrecta.</p>
                </form>
            </section>

            <section id="admin-panel" class="admin-panel" style="display: none;">
                <section id="area-management" class="management-section">
                    <h3>Gestión de Áreas</h3>
                    <form id="area-form" class="inline-form">
                        <input type="text" id="area-name" placeholder="Nombre del Área (Ej: Electricistas)" required>
                        <input type="text" id="area-icon" placeholder="Icono (Ej: ⚡)">
                        <button type="submit" id="save-area-button">Agregar Área</button>
                    </form>
                    <ul id="areas-list" class="item-list">
                        <!-- Las áreas se cargarán aquí -->
                    </ul>
                </section>

                <section id="professional-management" class="management-section" style="display: none;">
                    <h3>Gestión de Profesionales</h3>
                    <div class="filter-bar">
                        <label for="filter-area-prof">Filtrar por Área:</label>
                        <select id="filter-area-prof">
                            <option value="all">Todas</option>
                            <!-- Opciones de áreas se cargarán aquí -->
                        </select>
                        <button id="add-professional-button">Agregar Profesional</button>
                    </div>

                    <div id="professional-form-container" class="form-modal" style="display: none;">
                        <h4>Nuevo/Editar Profesional</h4>
                        <form id="professional-form">
                            <input type="hidden" id="professional-id">
                            <div class="form-group">
                                <label for="prof-name">Nombre: *</label>
                                <input type="text" id="prof-name" placeholder="Ej: Juan Pérez" required>
                            </div>
                            <div class="form-group">
                                <label for="prof-phone">Teléfono:</label>
                                <input type="text" id="prof-phone" placeholder="Ej: +54 9 11 1234-5678">
                            </div>
                            <div class="form-group">
                                <label for="prof-email">Email:</label>
                                <input type="email" id="prof-email" placeholder="Ej: juan@ejemplo.com">
                            </div>
                            <div class="form-group">
                                <label for="prof-description">Descripción:</label>
                                <textarea id="prof-description" placeholder="Describe tu especialidad y experiencia..."></textarea>
                            </div>
                            <div class="form-group">
                                <label for="prof-area">Área: *</label>
                                <select id="prof-area" required>
                                    <!-- Opciones de áreas se cargarán aquí -->
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Foto del Profesional:</label>
                                <div class="image-upload-group" onclick="document.getElementById('prof-foto-file').click()">
                                    <p style="margin: 0;">📸 Haz clic para subir una foto</p>
                                    <p class="upload-help">JPG, PNG o WebP • Máximo 5MB</p>
                                </div>
                                <input type="file" id="prof-foto-file" accept="image/jpeg,image/png,image/webp">
                                <img id="prof-foto-preview" alt="Vista previa">
                            </div>
                            <div class="form-group">
                                <label for="prof-activo" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                                    <input type="checkbox" id="prof-activo" checked style="width:18px;height:18px;cursor:pointer;">
                                    Profesional activo (visible en el catálogo)
                                </label>
                            </div>
                            <button type="submit">Guardar Profesional</button>
                            <button type="button" id="cancel-professional-button">Cancelar</button>
                        </form>
                    </div>

                    <table id="professionals-table">
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="professionals-table-body">
                            <!-- Los profesionales se cargarán aquí -->
                        </tbody>
                    </table>
                </section>
            </section>
        </main>
    </div>

    <div id="custom-modal" class="custom-modal" style="display: none;">
        <div class="modal-content">
            <p id="modal-message"></p>
            <div class="modal-actions">
                <button id="modal-confirm">Aceptar</button>
                <button id="modal-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="toast-notification" class="toast-notification" style="display: none;">
        <p id="toast-message"></p>
    </div>

    <script type="module" src="js/storage.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/admin_new.js"></script>
</body>
</html>
